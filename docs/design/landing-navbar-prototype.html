<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streaks: Landing navbar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!--
DESIGN REFERENCE: only the landing page NAVBAR. Not the whole page.
Everything under the navbar here is grey placeholder, it only exists so the scroll behaviour can be seen.
Reuse the existing landing page, tokens, logo flame and theme logic. Do not copy the prototype bar or placeholder blocks.

STYLE: a floating dark capsule ("pill") that hovers over the page, like a compact island.
- Pill: fully rounded, dark (--pill), light text, soft shadow under it, 1px faint edge. It floats 12px from the top and is sticky.
- Desktop (wide): the pill is only as wide as its content and centred. Inside, left to right:
  round white logo chip with the flame (44px) + "Streaks" wordmark, one text link ("Features"), a round theme button, and ONE white pill button "Get started" with an arrow.
- There is NO "Log in" in the navbar on any screen size. People log in from the sign-in screen that "Get started" opens (it must keep its Sign up / Log in switch).
- Phone (narrow): the pill spans the width with 12px side margins. Inside: logo chip only (no wordmark), then on the right the theme button and "Get started". The "Features" link is hidden on phone.
- Link: a soft light capsule fades in behind "Features" when it is hovered or focused.
- Theme button: 44px round icon button (sun and moon swap with a small turn). Same behaviour as the app: role="switch", aria-checked = dark, localStorage key "streaks-theme", first visit follows the device. Replaces the wide track switch in the navbar only.
- Scroll: the pill stays the same shape; its shadow gets a little deeper after scrolling.
- Life: flame in the logo chip flickers softly and grows on hover; arrow on the button nudges on hover. All motion respects prefers-reduced-motion.
- Accessibility: header with a nav landmark, "Skip to content" link, every target at least 44px, visible focus rings, text/background contrast checked.
- Colours (light mode): pill #12201C, link text #D3E2DC, button white with #12201C text. (dark mode): pill #1F312B on the darker page so it still reads as a floating object. Button stays white.
-->
<style>
:root{
  --bg:#EAF1EE; --surface:#FFFFFF; --ink:#12201C; --muted:#586C66; --line:#D5E1DC;
  --accent:#13795B; --accent-ink:#FFFFFF; --flame:#F2780C; --sun:#FFB23E; --moon:#A9B6FF;
  --pill:#12201C; --pill-ink:#FFFFFF; --pill-muted:#D3E2DC; --pill-edge:rgba(255,255,255,.08);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 8px 24px rgba(18,32,28,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1513; --surface:#16231F; --ink:#E8F2EE; --muted:#97ADA6; --line:#26372F;
    --accent:#3DD6A3; --accent-ink:#06201A; --flame:#FFA03D;
    --pill:#1F312B; --pill-edge:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#16231F; --ink:#E8F2EE; --muted:#97ADA6; --line:#26372F;
  --accent:#3DD6A3; --accent-ink:#06201A; --flame:#FFA03D;
  --pill:#1F312B; --pill-edge:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2{font-family:var(--display);letter-spacing:-.01em}

/* prototype helper bar (not part of the app) */
.proto{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line)}
.proto b{font-weight:700;color:var(--ink);margin-right:2px}
.proto button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;min-height:32px}
.proto button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

/* the preview frame: the navbar reacts to the frame width, so you can compare phone and desktop here */
.stage{padding:18px 12px 28px;display:flex;justify-content:center}
.frame{width:100%;max-width:var(--fw,390px);height:min(620px,calc(100vh - 120px));min-height:420px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;position:relative;container-type:inline-size;transition:max-width .35s cubic-bezier(.2,.8,.2,1)}

/* ---------- THE NAVBAR (this is the feature) ---------- */
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:#12201C;padding:10px 16px;border-radius:999px;font-weight:700;text-decoration:none;z-index:10;transition:top .15s}
.skip:focus{top:12px}
.l-head{position:sticky;top:0;z-index:5;padding:12px 12px 0;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:2px;width:100%;padding:6px;border-radius:999px;background:var(--pill);color:var(--pill-ink);border:1px solid var(--pill-edge);box-shadow:0 10px 26px rgba(18,32,28,.22),0 2px 6px rgba(18,32,28,.18);transition:box-shadow .25s}
.l-head.scrolled .pill{box-shadow:0 16px 38px rgba(18,32,28,.34),0 3px 8px rgba(18,32,28,.22)}
.pill :focus-visible{outline:3px solid #fff;outline-offset:2px}

.logo{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:999px;color:var(--pill-ink);font-family:var(--display);font-weight:800;font-size:19px;padding-right:6px}
.chip{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.logo:hover .chip{transform:scale(1.08) rotate(-6deg)}
.chip .flame{width:24px;height:24px;transform-origin:50% 90%;animation:flicker 2.4s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg)}35%{transform:scale(1.07,1.1) rotate(2deg)}65%{transform:scale(.97,1.03) rotate(-1deg)}}
.logo .word{display:none}

.links{position:relative;display:none;align-items:center}
.hl{position:absolute;top:0;left:0;height:100%;width:0;border-radius:999px;background:rgba(255,255,255,.13);opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
.link{position:relative;z-index:1;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:var(--pill-muted);font-weight:500;text-decoration:none;white-space:nowrap;border-radius:999px;transition:color .2s}
.link:hover,.link:focus-visible{color:#fff}
.link.hide-sm{display:none}

.theme{position:relative;margin-left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;transition:background .2s}
.theme:hover{background:rgba(255,255,255,.13)}
.theme svg{position:absolute;width:21px;height:21px;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .25s}
.theme .sun{color:var(--sun)}
.theme .moon{color:var(--moon);opacity:0;transform:rotate(-70deg) scale(.5)}
.theme[aria-checked="true"] .sun{opacity:0;transform:rotate(70deg) scale(.5)}
.theme[aria-checked="true"] .moon{opacity:1;transform:none}

.cta{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px;margin-left:2px;border-radius:999px;background:#fff;color:#12201C;font-weight:700;text-decoration:none;white-space:nowrap;flex:none;transition:transform .12s,box-shadow .2s}
.cta:hover{box-shadow:0 4px 14px rgba(255,255,255,.28)}
.cta:active{transform:scale(.97)}
.cta svg{width:16px;height:16px;transition:transform .2s}
.cta:hover svg{transform:translateX(3px)}

/* wide: the pill shrinks to its content and floats in the middle */
@container (min-width:640px){
  .l-head{padding-top:16px;display:flex;justify-content:center}
  .pill{width:fit-content;gap:4px;padding:7px 7px 7px 7px}
  .logo .word{display:inline;margin-left:0}
  .links{display:flex;margin-left:10px}
  .theme{margin-left:0}
  .cta{margin-left:6px}
  .link.hide-sm{display:inline-flex}
}

/* ---------- placeholder page content, only to show the scroll ---------- */
.ph{max-width:1120px;margin:0 auto;padding:36px 20px 60px;display:grid;gap:18px}
.ph .tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ph h1{font-size:clamp(34px,9cqw,60px);line-height:1;font-weight:800;max-width:14ch}
.ph .bar{height:14px;border-radius:8px;background:var(--line);max-width:46ch}
.ph .bar.s{max-width:30ch}
.ph .hero-cta{display:inline-flex;align-self:start;justify-self:start;align-items:center;min-height:52px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-top:6px;text-decoration:none}
.ph .block{height:170px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.ph .row{display:grid;gap:14px;grid-template-columns:1fr}
@container (min-width:640px){.ph .row{grid-template-columns:repeat(3,1fr)}.ph{padding:56px 28px 80px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="proto">
  <b>Preview width</b>
  <button type="button" data-w="390" aria-pressed="true">Phone</button>
  <button type="button" data-w="1000" aria-pressed="false">Desktop</button>
  <span>Scroll inside the frame. Hover "Features".</span>
</div>

<div class="stage">
  <div class="frame" id="frame">
    <a class="skip" href="#main">Skip to content</a>
    <header class="l-head" id="head">
      <nav class="pill" aria-label="Main">
        <a class="logo" href="#top" aria-label="Streaks home">
          <span class="chip"><svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.9 3.6 5.2 5.9 5.2 11a5.2 5.2 0 0 1-10.4 0c0-2.2 1-3.6 2.1-4.7.3 1.4 1 2.2 1.8 2.5C10.2 7.5 10.6 4.2 12 1.5z" fill="#F2780C"/><path d="M12 21.5a3.2 3.2 0 0 1-3.2-3.2c0-1.8 1.5-2.7 2.1-4.2.5.9 1.1 1.3 1.7 1.3.1-1 .8-1.7 1.3-2.2.8 1.1 1.3 2.3 1.3 5.1a3.2 3.2 0 0 1-3.2 3.2z" fill="#FFD27A"/></svg></span>
          <span class="word">Streaks</span>
        </a>
        <div class="links" id="links">
          <span class="hl" id="hl" aria-hidden="true"></span>
          <a class="link hide-sm" href="#features">Features</a>
        </div>
        <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
        </button>
        <a class="cta" href="#start">Get started<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <div class="ph" id="top">
        <span class="tag">Placeholder for the rest of the landing page</span>
        <h1>Small habits. One streak at a time.</h1>
        <div class="bar"></div><div class="bar s"></div>
        <a class="hero-cta" href="#start">Start your first streak</a>
        <div class="block"></div>
        <div class="row" id="features"><div class="block"></div><div class="block"></div><div class="block"></div></div>
        <div class="block"></div>
        <div class="block"></div>
      </div>
    </main>
  </div>
</div>

<script>
(function(){
var KEY="streaks-theme",root=document.documentElement,btn=document.getElementById("theme");
var frame=document.getElementById("frame"),head=document.getElementById("head"),links=document.getElementById("links"),hl=document.getElementById("hl");
function stored(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function dark(){var t=root.getAttribute("data-theme");if(t)return t==="dark";return matchMedia("(prefers-color-scheme: dark)").matches}
function sync(){btn.setAttribute("aria-checked",String(dark()))}
var s=stored();if(s==="dark"||s==="light")root.setAttribute("data-theme",s);
sync();
btn.addEventListener("click",function(){
  var next=dark()?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem(KEY,next)}catch(e){}
  sync();
});
frame.addEventListener("scroll",function(){head.classList.toggle("scrolled",frame.scrollTop>6)},{passive:true});

/* the soft highlight follows hover and keyboard focus */
function moveTo(el){
  var lr=links.getBoundingClientRect(),er=el.getBoundingClientRect();
  hl.style.width=er.width+"px";hl.style.transform="translateX("+(er.left-lr.left)+"px)";hl.style.opacity="1";
}
links.querySelectorAll(".link").forEach(function(a){
  a.addEventListener("pointerenter",function(){moveTo(a)});
  a.addEventListener("focus",function(){moveTo(a)});
  a.addEventListener("blur",function(){hl.style.opacity="0"});
});
links.addEventListener("pointerleave",function(){hl.style.opacity="0"});

document.querySelectorAll(".proto [data-w]").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".proto [data-w]").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    frame.style.setProperty("--fw",b.dataset.w+"px");
  });
});
document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener("click",function(e){
  e.preventDefault();var id=a.getAttribute("href").slice(1);
  if(id==="top"||id==="main"){frame.scrollTo({top:0,behavior:"smooth"})}
  else if(id==="features"){var f=document.getElementById("features");frame.scrollTo({top:f.offsetTop-90,behavior:"smooth"})}
})});
})();
</script>
</body>
</html>
