# Calls the app's cron endpoints every 15 minutes: the nightly rollover (each user's day
# ends at their own midnight) and push reminders. Both are idempotent and process users
# within a time budget, so a late, repeated or partial run is harmless; the next run, or a
# user opening the app, picks up anything left over.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      the production URL, e.g. https://streaks.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
#
# GitHub may delay scheduled runs, and turns schedules off after 60 days without repo
# activity. cron/{rollover,reminders}.lastSuccessfulRun in Firestore shows the last run;
# see "Cron" in the README and step 7 of docs/DEPLOYMENT.md.
name: cron

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rollover
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/rollover"
          echo

      - name: Reminders
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --retry-all-errors \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL%/}/api/cron/reminders"
          echo
